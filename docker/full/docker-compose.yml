name: myaac-full
services:
  web:
    environment:
      MYAAC_INSTALL_SERVER_PATH: "/home/www-data/server"
      MYAAC_CONFIG_DIR: "/config"
    ports:
      - 8001:80
    build:
      args:
        user: www-data
        uid: 33
      context: ../../
      dockerfile: ./docker/full/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      - db
    volumes:
      - ./:/myaac-main-folder
      - config:/config

  db:
    restart: unless-stopped # always?
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: myaac
      MYSQL_PASSWORD: myaac
      MYSQL_USER: myaac
    ports:
      - 8003:3306
    build:
      context: ../../
      dockerfile: ./docker/full/Dockerfile-db
    volumes:
      - db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8002:80

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - mailpit-data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db:
  config:
  mailpit-data:
