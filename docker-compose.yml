services:
  web:
    environment:
      MYAAC_INSTALL_SERVER_PATH: "/home/www-data/forgottenserver"
    ports:
      - 8001:80
    build:
      args:
        user: www-data
        uid: 33
      context: ./
      dockerfile: ./docker/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      - db
    volumes:
      - ./:/myaac-main-folder

  db:
    image: mysql:8.0
    restart: unless-stopped # always?
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: myaac
      MYSQL_PASSWORD: myaac
      MYSQL_USER: myaac
    ports:
      - 8003:3306
    volumes:
      - db:/var/lib/mysql
    pre_start:
      - command: bash -c 'curl --output /docker-entrypoint-initdb.d/tfs_schema.sql "https://raw.githubusercontent.com/otland/forgottenserver/refs/heads/master/schema.sql"'

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8002:80

volumes:
  db:
