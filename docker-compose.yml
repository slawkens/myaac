services:
  web:
    environment:
      MYAAC_INSTALL_SERVER_PATH: "/home/www-data/server"
      MYAAC_CONFIG_DIR: "/config"
    ports:
      - 8001:80
    build:
      args:
        user: www-data
        uid: 33
      context: ./
      dockerfile: ./docker/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      - db
    volumes:
      - ./:/myaac-main-folder

  db:
    restart: unless-stopped # always?
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: myaac
      MYSQL_PASSWORD: myaac
      MYSQL_USER: myaac
    ports:
      - 8003:3306
    build:
      dockerfile: ./docker/Dockerfile-db
    volumes:
      - db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8002:80

volumes:
  db:
